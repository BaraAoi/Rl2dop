name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: mkdir -p ci && (./gradlew build --stacktrace --console=plain 2>&1 | tee ci/build.log; exit ${PIPESTATUS[0]})

      - name: save build log
        if: failure()
        run: |
          mkdir -p ci
          git config user.name "rl2dop-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A ci
          git commit -m "ci: build log [skip ci]" || true
          git push || true

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rl2dop-artifacts
          path: build/libs/

      - name: publish latest build
        if: github.ref == 'refs/heads/arena/cbe241d1-rl2dop' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (1.21.1)
          body: |
            Автоматическая сборка мода Rl2dop для Minecraft 1.21.1 (Fabric).
            Скачай `rl2dop-*.jar` и положи в папку `mods` вместе с Fabric API.
          files: build/libs/*.jar
          prerelease: true
          make_latest: true

  smoke:
    name: smoke (dedicated server)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: run dedicated server
        run: |
          chmod +x ./gradlew
          mkdir -p run ci
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\nmax-tick-time=-1\n' > run/server.properties
          rm -f /tmp/cmd; mkfifo /tmp/cmd
          (./gradlew runServer --console=plain < /tmp/cmd > ci/smoke.log 2>&1 &)
          exec 3> /tmp/cmd
          for i in $(seq 1 150); do
            if grep -q "Done (" ci/smoke.log 2>/dev/null; then echo "SERVER_STARTED" >> ci/smoke.log; break; fi
            if grep -qE "Failed to start the minecraft server|ModResolutionException" ci/smoke.log 2>/dev/null; then echo "SERVER_FAILED" >> ci/smoke.log; break; fi
            sleep 2
          done
          sleep 3
          for cmd in "settle_spawn SmokeTown" "give_coins 500" "spawn_npc farmer" "spawn_npc trader" "spawn_npc guard" "spawn_npc cook" "market_dump" "npc_list" "salary_set farmer 15" "price_set minecraft:bread 5" "shelf_add minecraft:bread" "hall_board" "shop_marker" "npc_profession lumberjack" "settle_bind SmokeVillage" "market_dump smoketown" "econ_log 8"; do
            echo "=== CMD: $cmd ===" >> ci/smoke.log
            echo "$cmd" >&3
            sleep 2
          done
          sleep 20
          echo "stop" >&3 || true
          sleep 15
          pkill -f devlaunchinjector || true
          pkill -f "net.minecraft.server" || true
          sleep 3
          {
            echo "=== файлы мода ==="
            ls -la run/config/rl2dop.json run/world/data/ 2>&1 || true
            head -c 900 run/config/rl2dop.json 2>&1 || true
            echo ""
            echo "=== rl2dop: строки мода ==="
            grep -a "rl2dop" ci/smoke.log | tail -30 || true
            echo "=== ошибки/исключения ==="
            grep -aE "ERROR|Exception|Caused by" ci/smoke.log | grep -av "ExceptionHandler" | tail -60 || true
          } >> ci/smoke.log

      - name: save smoke log
        if: always()
        run: |
          git config user.name "rl2dop-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A ci
          git commit -m "ci: smoke log [skip ci]" || true
          git push || true
