name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: mkdir -p ci && (./gradlew build --stacktrace --console=plain 2>&1 | tee ci/build.log; exit ${PIPESTATUS[0]})

      - name: save build log
        if: failure()
        run: |
          mkdir -p ci
          git config user.name "rl2dop-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A ci
          git commit -m "ci: build log [skip ci]" || true
          git push || true

      - name: add stable asset name
        run: |
          cd build/libs
          for f in rl2dop-*.jar
          do
            case "$f" in
              *-sources.jar) ;;
              *) cp -f "$f" rl2dop-latest.jar ;;
            esac
          done
          ls -la

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rl2dop-artifacts
          path: build/libs/

      - name: publish latest build
        if: github.ref == 'refs/heads/arena/cbe241d1-rl2dop' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (1.21.1)
          body: |
            Автоматическая сборка мода Rl2dop для Minecraft 1.21.1 (Fabric).
            Постоянная ссылка (всегда последняя сборка): `rl2dop-latest.jar`.
            Версия в имени файла растётся на каждое обновление (`mod_version` в gradle.properties).
            Положи jar в папку `mods` вместе с Fabric API.
          files: build/libs/*.jar
          prerelease: true
          make_latest: true

  smoke:
    name: smoke (dedicated server)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: run dedicated server (fresh world + economy commands)
        run: |
          chmod +x ./gradlew
          mkdir -p run ci
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\ngenerator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":3},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}\nspawn-protection=0\nmax-tick-time=-1\n' > run/server.properties
          rm -f /tmp/cmd1; mkfifo /tmp/cmd1
          (./gradlew runServer --console=plain < /tmp/cmd1 > ci/smoke.log 2>&1 &)
          exec 3> /tmp/cmd1
          for i in $(seq 1 150); do grep -q "Done (" ci/smoke.log 2>/dev/null && break; sleep 2; done
          sleep 3
          for cmd in "settle_spawn SmokeTown" "settle_build" "settle_mayor" "house_add" "give_coins 500" "wallet" "spawn_npc farmer" "spawn_npc trader" "spawn_npc guard" "spawn_npc cook" "spawn_npc miner" "spawn_npc builder" "market_dump" "npc_list" "salary_set farmer 15" "price_set minecraft:bread 5" "shelf_add minecraft:bread" "hall_board" "shop_marker" "settle_tavern" "settle_settlers smoketown 3" "npc_profession lumberjack" "settle_bind SmokeVillage" "econ_log 8"; do
            echo "$cmd" >&3
            sleep 2
          done
          # переселенцы расходятся по вакансиям, строитель ведёт самострой, жители держатся
          # у своих мастерских — смотрим динамику в двух снимках
          sleep 45
          echo "market_dump smoketown" >&3; sleep 4
          echo "npc_list" >&3; sleep 4
          echo "settle_settlers smoketown 2" >&3; sleep 6
          sleep 40
          echo "market_dump smoketown" >&3; sleep 4
          echo "npc_list" >&3; sleep 4
          echo "econ_log 12" >&3; sleep 4
          echo "stop" >&3 || true
          sleep 15
          exec 3>&-
          pkill -f devlaunchinjector || true
          sleep 2

      - name: run dedicated server (restart, persistence check)
        run: |
          rm -f /tmp/cmd2; mkfifo /tmp/cmd2
          (./gradlew runServer --console=plain < /tmp/cmd2 > ci/smoke2.log 2>&1 &)
          exec 3> /tmp/cmd2
          for i in $(seq 1 150); do grep -q "Done (" ci/smoke2.log 2>/dev/null && break; sleep 2; done
          sleep 3
          echo "market_dump smoketown" >&3; sleep 3
          echo "settle_build smoketown grow" >&3; sleep 3
          echo "settle_mayor smoketown" >&3; sleep 3
          echo "house_add smoketown" >&3; sleep 3
          echo "market_dump smoketown" >&3; sleep 3
          echo "npc_list" >&3; sleep 3
          sleep 10
          echo "npc_list" >&3; sleep 3
          echo "econ_log 20" >&3; sleep 3
          echo "stop" >&3 || true
          sleep 15
          exec 3>&-
          pkill -f devlaunchinjector || true
          sleep 2

      - name: collect smoke summary
        if: always()
        run: |
          {
            echo "=== файлы мода ==="
            ls -la run/config/rl2dop.json run/world/data/ 2>&1 || true
            echo ""
            echo "=== перезапуск: что прочиталось ==="
            echo "--- первый запуск: постройки, кошелёк, цены ---"
            grep -aE "Поселение|поселение|казна=|постройка|табличек|таблички|напечатано|эмиссия|Лавка|создано|работа |мастерских|подарок|Дом поставлен|спасено|главой|ваканс|переселен|прибыл|пришёл|таверн|строит|перерыв|сходка" ci/smoke.log 2>/dev/null | tail -60 || true
            grep -aE "сохранение загружено|казна=|NPC|Эмиссия|Поселение|поселение|загружено NPC|цена=|погиб|постройка|работа |мастерских|подарок|табличк|ваканс|таверн|строит|без работы" ci/smoke2.log 2>/dev/null | tail -80 || true
            echo "=== ошибки/исключения (оба запуска) ==="
            grep -aE "ERROR|Exception|Caused by" ci/smoke.log ci/smoke2.log 2>/dev/null | grep -avE "ExceptionHandler|No key layers" | tail -60 || true
          } >> ci/smoke.log

      - name: save smoke log
        if: always()
        run: |
          git config user.name "rl2dop-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A ci
          git commit -m "ci: smoke log [skip ci]" || true
          git push || true
